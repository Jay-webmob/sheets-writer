<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pick a Spreadsheet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f8f9fa;
      color: #333;
    }
    #msg { font-size: 1.1rem; margin-top: 16px; }
    .spinner {
      border: 4px solid #e0e0e0;
      border-top: 4px solid #4285f4;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div id="msg">Loading Google Picker...</div>

  <script src="https://apis.google.com/js/api.js"></script>
  <script>
    // =============================================================
    // CONFIGURE THESE — from your Google Cloud project
    // API key: Cloud Console → APIs & Services → Credentials → Create API Key
    // App ID:  Cloud Console → Dashboard → Project number (numeric)
    // =============================================================
    const API_KEY = 'YOUR_GOOGLE_CLOUD_BROWSER_API_KEY';
    const APP_ID  = 'YOUR_CLOUD_PROJECT_NUMBER';
    // =============================================================

    function setMsg(text) {
      document.getElementById('msg').textContent = text;
    }

    // Parse #token=...&extId=... from the URL hash
    const params = Object.fromEntries(
      location.hash.slice(1).split('&')
        .filter(Boolean)
        .map(p => p.split('=').map(decodeURIComponent))
    );
    const token = params.token;
    const extId  = params.extId;

    if (!token || !extId) {
      setMsg('Missing token or extension ID. Open this page from the Sheets Writer extension.');
      document.getElementById('spinner').style.display = 'none';
    } else {
      gapi.load('picker', showPicker);
    }

    function showPicker() {
      setMsg('Select a spreadsheet...');
      document.getElementById('spinner').style.display = 'none';

      const view = new google.picker.View(google.picker.ViewId.SPREADSHEETS);
      const picker = new google.picker.PickerBuilder()
        .setOAuthToken(token)
        .setDeveloperKey(API_KEY)
        .setAppId(APP_ID)
        .addView(view)
        .setCallback(onPicked)
        .build();

      picker.setVisible(true);
    }

    function onPicked(data) {
      if (data.action === google.picker.Action.PICKED) {
        const file = data.docs[0];
        setMsg(`Selected: "${file.name}". Saving to extension...`);
        chrome.runtime.sendMessage(
          extId,
          { type: 'PICKER_PICKED', fileId: file.id, fileName: file.name },
          () => { setMsg('Done! This tab will close automatically.'); }
        );
      } else if (data.action === google.picker.Action.CANCEL) {
        setMsg('Cancelled. You can close this tab.');
      }
    }
  </script>
</body>
</html>
